<body>

  <header>
    <div class="logo">K<span>-IA</span></div>
  </header>

  <main id="chat">

    <div class="welcome" id="welcome">
      <h1>👋 Bonjour !</h1>
      <p>Je suis K-IA. Comment puis-je t'aider ?</p>
    </div>

  </main>

  <div class="input-area">

    <div class="input-box">

      <textarea
        id="messageInput"
        placeholder="Écris ton message..."
      ></textarea>

      <button
        id="sendButton"
        type="button"
      >➤</button>

    </div>

    <div class="info">
      K-IA peut faire des erreurs. Vérifie les informations importantes.
    </div>

  </div>

  <script>

    const WORKER_URL =
      "https://k-ia-server.elabedkamil47.workers.dev/";

    const input =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    let waiting = false;

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        sendMessage();
      }

    });

    async function sendMessage() {

      if (waiting) return;

      const message =
        input.value.trim();

      if (!message) return;

      waiting = true;
      sendButton.disabled = true;
      sendButton.style.opacity = "0.5";

      const welcome =
        document.getElementById("welcome");

      if (welcome) {
        welcome.remove();
      }

      addMessage(message, "user");

      input.value = "";

      const loading =
        addMessage(
          "K-IA réfléchit... 🤔",
          "bot"
        );

      try {

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: message
              })
            }
          );

        const text =
          await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch {

          throw new Error(
            "Réponse invalide du serveur : " +
            text
          );

        }

        loading.remove();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Erreur serveur : " +
            response.status
          );

        }

        if (!data.answer) {

          throw new Error(
            "K-IA n'a reçu aucune réponse."
          );

        }

        addMessage(
          data.answer,
          "bot"
        );

      } catch (error) {

        loading.remove();

        addMessage(
          "❌ ERREUR : " +
          error.message,
          "bot"
        );

        console.error(
          "K-IA ERROR:",
          error
        );

      } finally {

        waiting = false;

        sendButton.disabled = false;

        sendButton.style.opacity = "1";

        input.focus();

      }

    }

    function addMessage(
      text,
      type
    ) {

      const chat =
        document.getElementById("chat");

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      bubble.textContent =
        text;

      message.appendChild(
        bubble
      );

      chat.appendChild(
        message
      );

      chat.scrollTop =
        chat.scrollHeight;

      return message;

    }

  </script>

</body>
</html>
